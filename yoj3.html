function tools(){return `<h2 class='sec'>${bi('Document Formatter','कागदपत्र तयार करा')}</h2><div class='card'><div class='par' style='background:var(--vbg);border-color:var(--amb)'>⚠ ${bi('Enter the exact limits shown on the portal’s own upload screen. Limits change, so we do not hard-code them. Your file stays on your device.','पोर्टलच्या अपलोड स्क्रीनवर दिसणाऱ्या मर्यादा येथे टाका. मर्यादा बदलतात, म्हणून आम्ही त्या ठरवून देत नाही. तुमची फाइल तुमच्या उपकरणातच राहते.')}</div><div class='grid'><div><label>${bi('Photo or signature (image)','फोटो किंवा सही (प्रतिमा)')}</label><input id='ff' type='file' accept='image/*'></div><div><label>${bi('Max size (KB)','कमाल आकार (KB)')}</label><input id='fk' type='number' value='50' min='5'></div><div><label>${bi('Width (px, 0 = keep)','रुंदी (px, 0 = तशीच)')}</label><input id='fw' type='number' value='0' min='0'></div><div><label>${bi('Height (px, 0 = auto)','उंची (px, 0 = आपोआप)')}</label><input id='fh' type='number' value='0' min='0'></div></div><p><button class='btn' data-a='fmt'>${bi('Make my file upload-ready','माझी फाइल तयार करा')}</button></p><div id='fo' aria-live='polite'></div><p class='mut'>${bi('Width and height both set = centre-crop to that exact size. For PDFs, use the PDF tools below.','रुंदी व उंची दोन्ही दिल्यास त्या आकारात मध्यभागी क्रॉप होते. PDF साठी खालील साधने वापरा.')}</p></div>`+pdfui()}
async function fmt(){const f=$('#ff').files[0];if(!f){$('#fo').textContent=bi('Choose an image first.','आधी प्रतिमा निवडा.');return}const kb=+$('#fk').value||50,w=+$('#fw').value||0,h=+$('#fh').value||0;const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)}).catch(()=>null);if(!img){$('#fo').textContent='Could not read this image.';return}let W=img.width,H=img.height,sx=0,sy=0,sw=W,sh=H,cw=W,ch=H;if(w&&h){const r=w/h;if(W/H>r){sw=H*r;sx=(W-sw)/2}else{sh=W/r;sy=(H-sh)/2}cw=w;ch=h}else if(w){cw=w;ch=Math.round(H*w/W)}const c=document.createElement('canvas'),x=c.getContext('2d');let blob,q=.92,k=1;for(let t=0;t<40;t++){c.width=Math.max(1,Math.round(cw*k));c.height=Math.max(1,Math.round(ch*k));x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(blob.size<=kb*1024)break;if(q>.3)q-=.07;else if(w&&h)break;else k*=.9}const ok=blob.size<=kb*1024,u=URL.createObjectURL(blob);$('#fo').innerHTML=`<div class='row'><img src='${u}' alt='preview' style='max-height:120px;border-radius:8px;border:1px solid var(--line)'><div><b>${(blob.size/1024).toFixed(1)} KB</b> · ${c.width}×${c.height}px<br><span class='pill ${ok?'ok':'ver'}'>${ok?'OK':bi('Could not reach the limit – lower the size or crop less','मर्यादा गाठता आली नाही')}</span><br><a class='btn' style='margin-top:8px' download='upload-ready.jpg' href='${u}'>${bi('Download','डाउनलोड')} ↓</a></div></div>`}

function show(){S.si=S.si||0;const c=[['Families: discover the schemes meant for you, together','कुटुंबे: तुमच्यासाठी असलेल्या योजना एकत्र शोधा','परिवार: अपने लिए बनी योजनाएं साथ मिलकर खोजें'],['Farmers: find the right scheme and apply on the official site','शेतकरी: योग्य योजना शोधा आणि अधिकृत साइटवर अर्ज करा','किसान: सही योजना खोजें और आधिकारिक साइट पर आवेदन करें'],['Students: get documents ready before the scholarship deadline','विद्यार्थी: शिष्यवृत्तीच्या मुदतीआधी कागदपत्रे तयार करा','विद्यार्थी: छात्रवृत्ति की समय-सीमा से पहले दस्तावेज़ तैयार करें'],['Young graduates: find schemes for your next step','तरुण पदवीधर: पुढच्या पावलासाठी योजना शोधा','युवा स्नातक: अगले कदम के लिए योजनाएं खोजें']];return `<div class='ss' role='region' aria-roledescription='carousel' aria-label='${bi('Who we help','आम्ही कोणाला मदत करतो')}'>${SC.map((s,k)=>`<div class='sl${k==S.si?' on':''}'>${s}<div class='cap'>${bi(c[k][0],c[k][1],c[k][2])}</div></div>`).join('')}<button class='ar l' data-a='sg' data-i='-1' aria-label='Previous'>‹</button><button class='ar r' data-a='sg' data-i='1' aria-label='Next'>›</button></div>`}
function sg(i){S.si=((i%4)+4)%4;document.querySelectorAll('.sl').forEach((e,k)=>e.classList.toggle('on',k==S.si))}
function faq(){const q=[['Is this the government website?','No. We are an independent guidance service and always send you to the official portal to apply.','हे सरकारी संकेतस्थळ आहे का?','नाही. आम्ही स्वतंत्र मार्गदर्शन सेवा आहोत आणि अर्ज करण्यासाठी नेहमी अधिकृत पोर्टलवर पाठवतो.'],['Do you charge any fee?','No. It is free, with no hidden fees. Never pay anyone who claims to be us.','काही शुल्क आहे का?','नाही. सेवा मोफत आहे, छुपे शुल्क नाही. आमच्या नावाने पैसे मागणाऱ्याला देऊ नका.'],['Will you ask for my OTP or password?','Never. Enter OTPs only on official government sites.','तुम्ही OTP किंवा पासवर्ड मागाल का?','कधीही नाही. OTP फक्त अधिकृत सरकारी साइटवर टाका.'],['Where is my data stored?','In this demo, only on your own device. Files you format or combine never leave it.','माझी माहिती कुठे साठवली जाते?','या डेमोमध्ये फक्त तुमच्या उपकरणात. तुम्ही तयार केलेल्या फाइल बाहेर जात नाहीत.'],['Can you apply for me?','No. You submit on the official portal; we help you get ready.','तुम्ही माझ्यासाठी अर्ज कराल का?','नाही. अर्ज अधिकृत पोर्टलवर तुम्ही कराल; आम्ही तयारी करण्यात मदत करतो.']];return `<h2 class='sec'>${bi('Frequently asked questions','नेहमी विचारले जाणारे प्रश्न')}</h2><div class='card'>${q.map(x=>`<details style='margin:8px 0'><summary>${bi(x[0],x[2])}</summary><p class='mut'>${bi(x[1],x[3])}</p></details>`).join('')}</div>`}
function pdfui(){return `<h2 class='sec'>${bi('PDF tools','PDF साधने')}</h2><div class='card'><h3>${bi('PDF Creator','PDF तयार करा')}</h3><p class='mut'>${bi('Combine photos and PDFs into one PDF. Runs on your device.','फोटो व PDF एकत्र करून एक PDF बनवा. तुमच्या उपकरणावरच चालते.')}</p><input id='pi' type='file' multiple accept='image/*,application/pdf'><p><button class='btn' data-a='pmk'>${bi('Create PDF','PDF बनवा')}</button></p></div><div class='card'><h3>${bi('PDF Compressor','PDF लहान करा')}</h3><div class='grid'><div><label>PDF</label><input id='pc' type='file' accept='application/pdf'></div><div><label>${bi('Max size (KB)','कमाल आकार (KB)')}</label><input id='pk' type='number' value='200' min='20'></div></div><p><button class='btn' data-a='pcm'>${bi('Compress PDF','PDF कॉम्प्रेस करा')}</button></p><p class='mut'>${bi('Strong compression turns pages into images, so text cannot be selected. Keep your original.','जास्त कॉम्प्रेशनमध्ये पाने प्रतिमा होतात, मजकूर निवडता येत नाही. मूळ फाइल जपून ठेवा.')}</p></div><div id='po' aria-live='polite'></div>`}
function out(by,n,kb,m){const b=new Blob([by],{type:'application/pdf'}),u=URL.createObjectURL(b),ok=!kb||b.size<=kb*1024;$('#po').innerHTML=`<div class='card'><b>${(b.size/1024).toFixed(0)} KB</b> ${kb?`<span class='pill ${ok?'ok':'ver'}'>${ok?'OK':bi('Above the limit – try a smaller file','सीमेपेक्षा मोठी – लहान फाइल वापरा')}</span>`:''}${m=='light'?`<p class='mut'>${bi('Advanced compressor did not load; only light optimisation applied.','प्रगत कॉम्प्रेसर लोड झाला नाही; फक्त हलके ऑप्टिमायझेशन केले.')}</p>`:''}<p><a class='btn' download='${n}' href='${u}'>${bi('Download','डाउनलोड')} ↓</a></p></div>`}
async function jpg(f,q,mx){const i=await new Promise((ok,no)=>{const m=new Image();m.onload=()=>ok(m);m.onerror=no;m.src=URL.createObjectURL(f)});const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))}
async function pmk(){const fs=[...$('#pi').files],o=$('#po');if(!fs.length){o.textContent=bi('Choose files first.','आधी फाइल निवडा.');return}if(!window.PDFLib){o.textContent=bi('PDF engine did not load. Check your internet connection.','PDF इंजिन लोड झाले नाही. इंटरनेट तपासा.');return}try{const d=await PDFLib.PDFDocument.create();for(const f of fs){if(f.type=='application/pdf'){const s=await PDFLib.PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});(await d.copyPages(s,s.getPageIndices())).forEach(p=>d.addPage(p))}else{const im=await d.embedJpg(await (await jpg(f,.85,1800)).arrayBuffer()),p=d.addPage([595,842]),s=Math.min(555/im.width,802/im.height);p.drawImage(im,{x:(595-im.width*s)/2,y:(842-im.height*s)/2,width:im.width*s,height:im.height*s})}}out(await d.save(),'combined.pdf')}catch(e){o.textContent=bi('Could not read one of the files.','एक फाइल वाचता आली नाही.')}}
async function pcm(){const f=$('#pc').files[0],o=$('#po');if(!f){o.textContent=bi('Choose a PDF first.','आधी PDF निवडा.');return}if(!window.PDFLib){o.textContent=bi('PDF engine did not load. Check your internet connection.','PDF इंजिन लोड झाले नाही. इंटरनेट तपासा.');return}const kb=+$('#pk').value||200,buf=await f.arrayBuffer();o.textContent='…';if(window.pdfjsLib){try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;let last;for(const[sc,q]of[[1.4,.7],[1.2,.55],[1,.45],[.8,.35]]){const d=await PDFLib.PDFDocument.create();for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i),vp=pg.getViewport({scale:sc}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const im=await d.embedJpg(await (await new Promise(r=>c.toBlob(r,'image/jpeg',q))).arrayBuffer());d.addPage([vp.width,vp.height]).drawImage(im,{x:0,y:0,width:vp.width,height:vp.height})}last=await d.save();if(last.length<=kb*1024)break}out(last,'compressed.pdf',kb);return}catch(e){}}try{const d=await PDFLib.PDFDocument.load(buf,{ignoreEncryption:true});out(await d.save({useObjectStreams:true}),'compressed.pdf',kb,'light')}catch(e){o.textContent=bi('Could not read this PDF (it may be password-protected).','ही PDF वाचता आली नाही (पासवर्ड असू शकतो).')}}

function mic(f){const R=window.SpeechRecognition||window.webkitSpeechRecognition,el=document.querySelector('[name='+f+']');if(!R){el.placeholder=tri('Voice not supported here','या ब्राउझरमध्ये व्हॉइस नाही','इस ब्राउज़र में वॉयस नहीं');return}const r=new R();r.lang=LG[S.lang];el.placeholder='🎤…';r.onresult=e=>{const x=e.results[0][0].transcript.replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d)).replace(/,/g,''),m=x.match(/\d+/);if(m)el.value=m[0]};r.onerror=()=>{el.placeholder=''};r.start()}

// Deterministic rule engine: 1 = met, 0 = not met, 2 = needs verification
function ev(c,p){const[k,a,b]=c;
 if(k=="age")return !p.age?2:(p.age>=a&&p.age<=b?1:0);
 if(k=="occ")return !p.occ?2:(a.includes(p.occ)?1:0);
 if(k=="inc")return p.inc===""||p.inc==null?2:(p.inc<=a?1:0);
 if(k=="gen")return !p.gen?2:(p.gen==a?1:0);
 if(k=="land")return p.land=="yes"?1:p.land=="no"?0:2;
 if(k=="tax")return p.inc===""||p.inc==null||p.inc>300000?2:1;
 return 2}

 if(k=="age")return`${t("age")}: ${a}–${b>100?"∞":b}`;
